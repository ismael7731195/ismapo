name: Validar PowerShell M03-P02 REV1B

on:
  push:
    branches:
      - 'm03p02-rev1b-validator-*'
    paths:
      - '.github/workflows/validar-powershell-m03-p02-rev1b.yml'
  workflow_dispatch:

jobs:
  validate-package-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Construir scripts finales REV1B desde REV1A
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'parser-test\m03p02-rev1a'
          $target = Join-Path $env:GITHUB_WORKSPACE 'parser-test\m03p02-rev1b'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item (Join-Path $target 'scripts') -ItemType Directory -Force | Out-Null
          $block = @"
          Set-StrictMode -Version Latest
          `$ErrorActionPreference = 'Stop'
          `$scriptPath = `$MyInvocation.MyCommand.Path
          if ([string]::IsNullOrWhiteSpace(`$scriptPath)) { throw 'No fue posible resolver la ruta del script M03-P02 REV1B.' }
          `$scriptDirectory = Split-Path -Parent `$scriptPath
          if ([string]::IsNullOrWhiteSpace(`$PackageRoot)) { `$PackageRoot = Split-Path -Parent `$scriptDirectory }
          if ([string]::IsNullOrWhiteSpace(`$PackageRoot)) { throw 'No fue posible resolver la raiz del paquete M03-P02 REV1B.' }
          `$PackageRoot = [System.IO.Path]::GetFullPath(`$PackageRoot)
          if (-not (Test-Path -LiteralPath `$PackageRoot -PathType Container)) { throw "No existe la raiz del paquete: `$PackageRoot" }
          "@ -replace '(?m)^          ',''
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          foreach ($old in Get-ChildItem (Join-Path $source 'scripts') -Filter '*.ps1' -File) {
            $text = Get-Content -LiteralPath $old.FullName -Raw
            $text = $text.Replace('REV1A','REV1B')
            $text = $text.Replace('[string]$PackageRoot = (Split-Path -Parent $PSScriptRoot),','[string]$PackageRoot,')
            $text = $text.Replace("Set-StrictMode -Version Latest`r`n`$ErrorActionPreference = 'Stop'",$block)
            $text = $text.Replace("Set-StrictMode -Version Latest`n`$ErrorActionPreference = 'Stop'",$block)
            $text = $text.Replace("Set-StrictMode -Version Latest`r`n`$ErrorActionPreference='Stop'",$block)
            $text = $text.Replace("Set-StrictMode -Version Latest`n`$ErrorActionPreference='Stop'",$block)
            $text = $text.Replace("`$prevalidation = Join-Path `$PSScriptRoot 'PREVALIDAR_M03_P02_REV1B.ps1'","`$prevalidation = Join-Path `$scriptDirectory 'PREVALIDAR_M03_P02_REV1B.ps1'")
            if ($text -match '\$PackageRoot\s*=\s*\(Split-Path -Parent \$PSScriptRoot\)') { throw "Transformacion incompleta: $($old.Name)" }
            if ($text -notmatch '\$scriptPath = \$MyInvocation\.MyCommand\.Path') { throw "No se inyecto resolucion robusta: $($old.Name)" }
            $text = ($text -replace "`r?`n","`r`n")
            $newName = $old.Name.Replace('REV1A','REV1B')
            [System.IO.File]::WriteAllText((Join-Path (Join-Path $target 'scripts') $newName),$text,$utf8Bom)
          }
          $cmds = @{
            '00_PREVALIDAR_M03_P02_REV1B.cmd'='powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0scripts\PREVALIDAR_M03_P02_REV1B.ps1"'
            '01_AUTOPRUEBA_M03_P02_REV1B.cmd'='powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0scripts\AUTOPRUEBA_M03_P02_REV1B.ps1"'
            '02_APLICAR_M03_P02_REV1B.cmd'='powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0scripts\APLICAR_M03_P02_REV1B.ps1" -ConfirmarAplicacion'
            '03_REVERTIR_M03_P02_REV1B.cmd'='powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0scripts\REVERTIR_M03_P02_REV1B.ps1" -ConfirmarReversion'
          }
          foreach ($entry in $cmds.GetEnumerator()) {
            $content = "@echo off`r`nsetlocal`r`ntitle AGROINPACO ERP - M03 P02 REV1B`r`n$($entry.Value)`r`nset `"CODIGO=%ERRORLEVEL%`"`r`necho.`r`necho CODIGO_FINAL=%CODIGO%`r`npause`r`nexit /b %CODIGO%`r`n"
            [System.IO.File]::WriteAllText((Join-Path $target $entry.Key),$content,[System.Text.Encoding]::ASCII)
          }
          "REV1B_PACKAGE=$target" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'CONSTRUCCION_REV1B=APROBADA'

      - name: Analizador sintactico real Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:REV1B_PACKAGE 'scripts') -Filter '*.ps1' -File | Sort-Object FullName)
          if ($files.Count -ne 4) { throw "Se esperaban 4 archivos ps1 y se encontraron $($files.Count)." }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: linea {1}, columna {2}: {3}" -f $file.Name,$_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Message) }
              exit 1
            }
            Write-Host ("PARSER_OK={0};TOKENS={1};SHA256={2}" -f $file.Name,$tokens.Count,(Get-FileHash $file.FullName -Algorithm SHA256).Hash)
          }
          Write-Host ("POWERSHELL_VERSION={0}" -f $PSVersionTable.PSVersion)
          Write-Host 'ANALIZADOR=System.Management.Automation.Language.Parser.ParseFile'
          Write-Host 'ERRORES_SINTACTICOS=0'

      - name: Preparar contrato sintetico en ruta predeterminada real
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = $env:REV1B_PACKAGE
          $source = 'C:\AGROINPACO_ERP_EMPRESARIAL_2_0\FUENTE_TRABAJO\W'
          if (Test-Path 'C:\AGROINPACO_ERP_EMPRESARIAL_2_0') { Remove-Item 'C:\AGROINPACO_ERP_EMPRESARIAL_2_0' -Recurse -Force }
          New-Item $source -ItemType Directory -Force | Out-Null
          New-Item (Join-Path $package 'payload') -ItemType Directory -Force | Out-Null
          Push-Location $source
          try {
            dotnet new sln -n AgroInpacoERP.Web --format sln
            dotnet new console -n AgroInpaco.ContractChecks -o 'tests\AgroInpaco.ContractChecks' --framework net10.0 --no-restore
            dotnet sln 'AgroInpacoERP.Web.sln' add 'tests\AgroInpaco.ContractChecks\AgroInpaco.ContractChecks.csproj'
          }
          finally { Pop-Location }
          $targets = @(
            'src\AgroInpaco.Web\Components\Pages\Tesoreria\Transacciones.razor',
            'src\AgroInpaco.Web\Components\Pages\Tesoreria\ComprobanteEgreso.razor',
            'src\Legacy\AgroEmpaques.Application\Services\TesoreriaService.vb',
            'src\Legacy\AgroEmpaques.Application\Interfaces\ITesoreriaRepository.vb',
            'src\Legacy\AgroEmpaques.Infrastructure\Repositories\TesoreriaRepository.DocumentosImpresion.vb',
            'src\Legacy\AgroEmpaques.Domain\Entities\ComprasModelos.vb',
            'src\Legacy\AgroEmpaques.Infrastructure\Repositories\ComprasRepository.FacturasCxp.vb',
            'src\AgroInpaco.Web\Components\Pages\Compras\CuentasPorPagar.razor',
            'src\AgroInpaco.Web\Components\Pages\Compras\Abastecimiento.razor',
            'src\AgroInpaco.Web\Components\Pages\Compras\Anticipos.razor',
            'tests\AgroInpaco.ContractChecks\Program.cs'
          )
          $rows = New-Object System.Collections.Generic.List[object]
          foreach ($relative in $targets) {
            $baseFile = Join-Path $source $relative
            $payloadFile = Join-Path (Join-Path $package 'payload') $relative
            New-Item (Split-Path -Parent $baseFile) -ItemType Directory -Force | Out-Null
            New-Item (Split-Path -Parent $payloadFile) -ItemType Directory -Force | Out-Null
            if ($relative -eq 'tests\AgroInpaco.ContractChecks\Program.cs') {
              [System.IO.File]::WriteAllText($baseFile,'Console.WriteLine("BASELINE_CONTRACTCHECKS");',[System.Text.UTF8Encoding]::new($false))
              [System.IO.File]::WriteAllText($payloadFile,'Console.WriteLine("CONTRACT_CHECKS_PASSED");',[System.Text.UTF8Encoding]::new($false))
            } else {
              [System.IO.File]::WriteAllText($baseFile,('BASE::{0}' -f $relative),[System.Text.UTF8Encoding]::new($false))
              [System.IO.File]::WriteAllText($payloadFile,('PAYLOAD::{0}' -f $relative),[System.Text.UTF8Encoding]::new($false))
            }
            $rows.Add([pscustomobject]@{Ruta=$relative.Replace('\','/');SHA256_Base=(Get-FileHash $baseFile -Algorithm SHA256).Hash;SHA256_Payload=(Get-FileHash $payloadFile -Algorithm SHA256).Hash;Tamano_Base=(Get-Item $baseFile).Length;Tamano_Payload=(Get-Item $payloadFile).Length})
          }
          $rows | Export-Csv -LiteralPath (Join-Path $package 'MANIFIESTO_CAMBIOS_M03_P02_REV1B.tsv') -Delimiter "`t" -NoTypeInformation -Encoding UTF8
          "SYNTHETIC_SOURCE=$source" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'CONTRATO_SINTETICO=PREPARADO'

      - name: Reproducir invocacion real sin PackageRoot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:REV1B_PACKAGE\scripts\PREVALIDAR_M03_P02_REV1B.ps1" -NoEmpaquetarResultado
          if ($LASTEXITCODE -ne 0) { throw "Prevalidacion fallo con codigo $LASTEXITCODE" }
          $result = Get-ChildItem $env:REV1B_PACKAGE -Directory -Filter 'RESULTADOS_PREVALIDACION_M03_P02_REV1B_*' | Sort-Object Name -Descending | Select-Object -First 1
          $log = Get-Content -LiteralPath (Join-Path $result.FullName 'EJECUCION_PREVALIDACION.log') -Raw
          if ($log -notmatch [regex]::Escape("PACKAGE_ROOT=$env:REV1B_PACKAGE")) { throw 'PackageRoot no se resolvio a la carpeta del paquete.' }
          Write-Host 'PACKAGEROOT_IMPLICITO=APROBADO'
          Write-Host 'PREVALIDACION_SIN_PACKAGEROOT=APROBADA'

      - name: Aplicar y revertir sin PackageRoot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = @(Import-Csv -LiteralPath "$env:REV1B_PACKAGE\MANIFIESTO_CAMBIOS_M03_P02_REV1B.tsv" -Delimiter "`t")
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:REV1B_PACKAGE\scripts\APLICAR_M03_P02_REV1B.ps1" -ConfirmarAplicacion
          if ($LASTEXITCODE -ne 0) { throw "Aplicacion fallo con codigo $LASTEXITCODE" }
          foreach ($row in $manifest) {
            $path = Join-Path $env:SYNTHETIC_SOURCE ([string]$row.Ruta).Replace('/','\')
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne [string]$row.SHA256_Payload) { throw "Payload no aplicado: $($row.Ruta)" }
          }
          Write-Host 'APLICACION_SIN_PACKAGEROOT=APROBADA'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:REV1B_PACKAGE\scripts\REVERTIR_M03_P02_REV1B.ps1" -ConfirmarReversion
          if ($LASTEXITCODE -ne 0) { throw "Reversion fallo con codigo $LASTEXITCODE" }
          foreach ($row in $manifest) {
            $path = Join-Path $env:SYNTHETIC_SOURCE ([string]$row.Ruta).Replace('/','\')
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne [string]$row.SHA256_Base) { throw "Base no restaurada: $($row.Ruta)" }
          }
          Write-Host 'REVERSION_SIN_PACKAGEROOT=APROBADA'

      - name: Autoprueba sin PackageRoot en clon con acento
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:REV1B_PACKAGE\scripts\AUTOPRUEBA_M03_P02_REV1B.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Autoprueba fallo con codigo $LASTEXITCODE" }
          $result = Get-ChildItem $env:REV1B_PACKAGE -Directory -Filter 'RESULTADOS_AUTOPRUEBA_M03_P02_REV1B_*' | Sort-Object Name -Descending | Select-Object -First 1
          $text = Get-Content -LiteralPath (Join-Path $result.FullName 'RESULTADO_AUTOPRUEBA.txt') -Raw
          foreach ($expected in @('CODIGO_FINAL=0','COMPILACION_CLON_REBUILD=APROBADA','CONTRACTCHECKS_CLON=APROBADOS','RUTA_LARGA_Y_ACENTOS=APROBADA','FUENTE_OFICIAL_INTACTA=SI')) {
            if ($text -notmatch [regex]::Escape($expected)) { throw "Falta evidencia: $expected" }
          }
          Write-Host 'AUTOPRUEBA_SIN_PACKAGEROOT=APROBADA'

      - name: Reunir evidencias
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidencia-m03p02-rev1b'
          New-Item $evidence -ItemType Directory -Force | Out-Null
          Get-ChildItem $env:REV1B_PACKAGE -Recurse -File | Where-Object { $_.Name -like 'RESULTADO*.txt' -or $_.Name -like 'EJECUCION*.log' -or $_.Name -like '*.zip' -or $_.Name -like '*.ps1' } | Copy-Item -Destination $evidence -Force
          @('CODIGO_FINAL=0','MOTOR=Windows PowerShell 5.1','ANALIZADOR=System.Management.Automation.Language.Parser.ParseFile','ARCHIVOS_PS1=4','ERRORES_SINTACTICOS=0','PACKAGEROOT_IMPLICITO=APROBADO','PREVALIDACION_SIN_PACKAGEROOT=APROBADA','APLICACION_SIN_PACKAGEROOT=APROBADA','REVERSION_SIN_PACKAGEROOT=APROBADA','AUTOPRUEBA_SIN_PACKAGEROOT=APROBADA','DOTNET_SDK=10','SQL_EJECUTADO=NO','CAMBIOS_DATOS=0') | Set-Content -LiteralPath (Join-Path $evidence 'VALIDACION_GITHUB_ACTIONS_REV1B.txt') -Encoding UTF8

      - name: Publicar evidencias
        uses: actions/upload-artifact@v4
        with:
          name: EVIDENCIA_M03_P02_REV1B_POWERSHELL_REAL
          path: evidencia-m03p02-rev1b
          if-no-files-found: error
          retention-days: 7
